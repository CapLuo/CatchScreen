worker_processes auto;
events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            
            # 开启 HLS
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            
            # 允许所有来源推流 (生产环境建议限制)
            allow publish all;
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        # 1. 后端 API 和 前端页面 (转发到 Flask 5001)
        location /api/ {
            proxy_pass http://catchscreen:5001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /frontend/ {
            proxy_pass http://catchscreen:5001/frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # 视频文件访问
        location /uploads/ {
            proxy_pass http://catchscreen:5001/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # 根路径重定向到登录页
        location = / {
            return 302 /frontend/login.html;
        }

        # 2. HLS 预览页面 (转发到 webrtc_server 5002)
        location /preview {
            proxy_pass http://catchscreen:5002/preview;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # HLS 视频流文件
        location /hls/ {
            proxy_pass http://catchscreen:5002/hls/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # 状态页
        location /status {
            proxy_pass http://catchscreen:5002/status;
        }
    }
}
