<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📂 视频管理端</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    .folder-card { transition: transform .2s, box-shadow .2s, border-color .2s; cursor: pointer; border: 1px solid #dee2e6; }
    .folder-card:hover { transform: translateY(-4px); box-shadow: 0 0.75rem 1.25rem rgba(0,0,0,.08); border-color: #667eea; }
    .folder-card:hover .folder-icon { color: #667eea; }
    .folder-icon { font-size: 2.75rem; color: #667eea; transition: color .2s; }
    .skeleton { background: linear-gradient(90deg, #f2f2f2 25%, #e9ecef 37%, #f2f2f2 63%); background-size: 400% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    .upload-switch { display: flex; align-items: center; gap: 0.5rem; }
    .upload-switch .form-check-input { margin-top: 0; }
    .upload-switch .form-check-label { margin-bottom: 0; user-select: none; }
    .folder-card .btn, .folder-card .form-check { pointer-events: auto; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="bi bi-folder-symlink"></i> <span>视频管理端</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <div class="ms-auto d-flex gap-2">
          <input id="searchInput" class="form-control form-control-sm" placeholder="搜索 IP 或备注名" style="width: 220px;" type="search">
          <button class="btn btn-outline-light btn-sm" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i> 退出
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <h4 class="mb-0"><i class="bi bi-folder-check"></i> 视频文件夹</h4>
      <div class="d-flex gap-2">
        <select id="groupFilter" class="form-select" style="width: 160px; cursor: pointer;" onchange="applyFilters()">
          <option value="">所有分组</option>
        </select>
        <button id="refreshBtn" class="btn btn-primary" onclick="refreshFolders()">
          <i class="bi bi-arrow-clockwise"></i> 刷新
        </button>
      </div>
    </div>

    <div id="foldersList" class="row g-3">
      <!-- 骨架屏 -->
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <div class="card p-4 skeleton" style="height: 140px; border: 0; border-radius: .75rem;"></div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <div class="card p-4 skeleton" style="height: 140px; border: 0; border-radius: .75rem;"></div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <div class="card p-4 skeleton" style="height: 140px; border: 0; border-radius: .75rem;"></div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <div class="card p-4 skeleton" style="height: 140px; border: 0; border-radius: .75rem;"></div>
      </div>
    </div>
  </div>

  <!-- 备注编辑模态框 -->
  <div class="modal fade" id="remarkModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">编辑备注</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">IP</label>
            <input id="remarkIp" type="text" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">分组</label>
            <input id="groupInput" type="text" class="form-control" list="groupOptions" placeholder="选择或输入分组（可选）">
            <datalist id="groupOptions"></datalist>
          </div>
          <div class="mb-2">
            <label class="form-label">备注名</label>
            <input id="remarkInput" type="text" class="form-control" placeholder="输入备注...">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" id="saveRemarkBtn" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- WebRTC 预览模态框 -->
  <div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-broadcast"></i> 实时预览</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0">
          <iframe id="previewFrame" src="about:blank" style="width:100%;height:70vh;border:0;" allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen></iframe>
        </div>
      </div>
    </div>
  </div>

  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
    <div id="toast" class="toast text-bg-danger" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">错误</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script>
    const API_BASE = (window.APP_CONFIG && window.APP_CONFIG.apiBase) || 'http://127.0.0.1:5001/api';
    const WEBRTC_BASE = (window.APP_CONFIG && window.APP_CONFIG.webrtcBase) || 'http://127.0.0.1:5002';
    const toast = new bootstrap.Toast(document.getElementById('toast'), { delay: 2500 });
    const remarkModal = new bootstrap.Modal(document.getElementById('remarkModal'));
    const previewModal = new bootstrap.Modal(document.getElementById('previewModal'));

    let allFolders = [];
    let currentPreviewIp = null;

    // 更新推流直连状态
    async function updateWebrtcDirect(ip, enabled) {
      try {
        await fetch(`${API_BASE}/folders/${encodeURIComponent(ip)}/webrtc_direct`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ webrtc_direct: enabled })
        });
        const folder = allFolders.find(f => f.ip === ip);
        if (folder) folder.webrtc_direct = enabled;
      } catch (e) {
        console.error('Failed to update webrtc_direct', e);
      }
    }

    // 打开实时预览
    function openPreview(ip, deviceId) {
      currentPreviewIp = ip;
      // 开启直连推流
      updateWebrtcDirect(ip, true);
      
      const frame = document.getElementById('previewFrame');
      // 优先使用 deviceId，如果没有则回退到 ip
      const targetId = deviceId || ip;
      // 使用 ip 参数名以兼容旧版预览服务器，但值传递 targetId (device_id)
      frame.src = `${WEBRTC_BASE}/preview?ip=${encodeURIComponent(targetId)}`;
      previewModal.show();
    }

    // 检查登录状态
    async function checkAuth() {
      try {
        const response = await fetch(`${API_BASE}/check_login`, { credentials: 'include' });
        const result = await response.json();
        if (!result.logged_in) { window.location.href = 'login.html'; }
      } catch (error) {
        showError('无法验证登录状态');
        window.location.href = 'login.html';
      }
    }

    // 加载文件夹列表
    async function loadFolders(isBackground = false) {
      if (!isBackground) setLoading(true);
      try {
        const response = await fetch(`${API_BASE}/folders`, { credentials: 'include' });
        const result = await response.json();
        allFolders = result.folders || [];
        
        updateGroupFilterOptions(allFolders);
        applyFilters();
        
      } catch (error) {
        if (!isBackground) {
          document.getElementById('foldersList').innerHTML = `
            <div class="col-12">
              <div class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <div>加载失败：${error.message}</div>
              </div>
            </div>`;
          showError('加载失败');
        } else {
          console.warn('Background refresh failed:', error);
        }
      } finally {
        if (!isBackground) setLoading(false);
      }
    }

    function updateGroupFilterOptions(folders) {
      const select = document.getElementById('groupFilter');
      const currentVal = select.value;
      const groups = new Set();
      folders.forEach(f => {
        const { group } = parseRemark(f.remark);
        groups.add(group || '默认分组');
      });
      
      let html = '<option value="">所有分组</option>';
      Array.from(groups).sort((a, b) => {
         if (a === '默认分组') return 1;
         if (b === '默认分组') return -1;
         return a.localeCompare(b, 'zh-CN');
      }).forEach(g => {
        html += `<option value="${g}">${g}</option>`;
      });
      
      select.innerHTML = html;
      // 如果之前的选项还在，保持选中，否则重置
      if (select.querySelector(`option[value="${currentVal}"]`)) {
        select.value = currentVal;
      }
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const groupFilter = document.getElementById('groupFilter').value;
      
      const filtered = allFolders.filter(f => {
        // 分组过滤
        if (groupFilter) {
           const { group } = parseRemark(f.remark);
           const gName = group || '默认分组';
           if (gName !== groupFilter) return false;
        }
        
        // 搜索过滤
        if (query) {
          const ip = (f.ip || '').toLowerCase();
          const remark = (f.remark || '').toLowerCase();
          return ip.includes(query) || remark.includes(query);
        }
        return true;
      });
      
      renderFolders(filtered);
    }

    function parseRemark(rawRemark) {
      if (!rawRemark || rawRemark === 'null') return { group: '', name: '' };
      const idx = rawRemark.indexOf('_');
      if (idx > 0) {
        return { group: rawRemark.substring(0, idx), name: rawRemark.substring(idx + 1) };
      }
      return { group: '', name: rawRemark };
    }

    function renderFolders(folders) {
      const container = document.getElementById('foldersList');
      if (!folders.length) {
        container.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-folder-x" style="font-size: 4rem; color: #ccc;"></i>
            <p class="text-muted mt-3">暂无文件夹</p>
          </div>`;
        return;
      }

      // 分组处理
      const groups = {};
      const DEFAULT_GROUP = '默认分组';
      
      folders.forEach(f => {
        const { group, name } = parseRemark(f.remark);
        f._displayName = name; // 临时字段用于显示
        f._groupName = group;
        const gKey = group || DEFAULT_GROUP;
        if (!groups[gKey]) groups[gKey] = [];
        groups[gKey].push(f);
      });

      // 更新 datalist
      const groupNames = Object.keys(groups).filter(g => g !== DEFAULT_GROUP).sort();
      const datalist = document.getElementById('groupOptions');
      if (datalist) {
        datalist.innerHTML = groupNames.map(g => `<option value="${g}">`).join('');
      }

      // 排序分组：默认分组放最后
      const sortedKeys = Object.keys(groups).sort((a, b) => {
        if (a === DEFAULT_GROUP) return 1;
        if (b === DEFAULT_GROUP) return -1;
        return a.localeCompare(b, 'zh-CN');
      });

      let html = '';
      const showHeaders = sortedKeys.length > 1 || sortedKeys[0] !== DEFAULT_GROUP;

      sortedKeys.forEach(gName => {
        const list = groups[gName];
        const onlineCount = list.filter(f => f.online).length;

        if (showHeaders) {
          html += `
            <div class="col-12 mt-4 mb-1">
              <div class="d-flex align-items-center border-bottom pb-2">
                <h5 class="mb-0 text-primary"><i class="bi bi-people me-2"></i>${gName}</h5>
                <span class="ms-3 badge bg-light text-secondary border">${onlineCount} / ${list.length} 在线</span>
              </div>
            </div>`;
        }

        html += list.map(folder => `
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
          <div class="folder-card card shadow-sm h-100" onclick="openPreview('${folder.ip}', '${folder.device_id || ''}')" style="cursor: pointer;">
            <div class="card-body py-3 d-flex flex-column">
              <div class="d-flex align-items-start justify-content-between mb-2">
                <div class="text-end w-100">
                  <div class="d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-2">
                      <i class="bi bi-folder folder-icon"></i>
                      <div class="fw-semibold text-truncate" style="max-width: 140px;" title="${folder.ip}">${folder.ip}</div>
                    </div>
                    <div>
                      <span class="badge ${folder.online ? 'bg-success' : 'bg-secondary'}">${folder.online ? '在线' : '离线'}</span>
                    </div>
                  </div>
                </div>
              </div>
              
              <div class="text-muted small"><i class="bi bi-camera-video"></i> ${folder.video_count} 个视频</div>
              <div class="text-muted small" style="min-height: 21px;">
                ${folder.last_upload_at ? `最近上传：${folder.last_upload_at}` : ''}
              </div>

              <div class="mt-auto">
                <div class="d-flex align-items-center gap-2 mt-2 mb-2" onclick="event.stopPropagation();">
                  <div class="form-check form-switch upload-switch">
                    <input class="form-check-input" type="checkbox" id="uploadEnabled_${folder.ip.replace(/\./g, '_')}" 
                           ${folder.upload_enabled ? 'checked' : ''} 
                           onchange="toggleUploadEnabled('${folder.ip}', this.checked)"
                           style="cursor: pointer;">
                    <label class="form-check-label small" for="uploadEnabled_${folder.ip.replace(/\./g, '_')}" style="cursor: pointer;">
                      <i class="bi ${folder.upload_enabled ? 'bi-cloud-upload' : 'bi-cloud-slash'}"></i> 
                      <span>${folder.upload_enabled ? '允许上传' : '禁止上传'}</span>
                    </label>
                  </div>
                </div>
                <div class="d-flex align-items-center gap-2 mt-2" onclick="event.stopPropagation();">
                  <div class="text-truncate flex-grow-1" style="min-width: 0;">
                    ${folder._displayName ? `<span class="text-info small" title="${folder.remark}">${folder._displayName}</span>` : '<span class="text-muted small">无备注</span>'}
                  </div>
                  <button class="btn btn-sm btn-outline-primary flex-shrink-0" onclick="event.stopPropagation(); openRemark('${folder.ip}', '${(folder.remark||'').replace(/'/g, "&#39;")}')">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-secondary flex-shrink-0" onclick="event.stopPropagation(); viewFolder('${folder.ip}')">
                    <i class="bi bi-collection-play"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>`).join('');
      });

      container.innerHTML = html;
    }

    function openRemark(ip, remark) {
      document.getElementById('remarkIp').value = ip;
      const { group, name } = parseRemark(remark);
      document.getElementById('groupInput').value = group;
      document.getElementById('remarkInput').value = name;
      remarkModal.show();
    }

    // ... (toggleUploadEnabled unchanged) ...

    document.getElementById('saveRemarkBtn').addEventListener('click', async () => {
      const ip = document.getElementById('remarkIp').value;
      const group = document.getElementById('groupInput').value.trim();
      const name = document.getElementById('remarkInput').value.trim();
      
      let finalRemark = name;
      if (group && name) {
        finalRemark = `${group}_${name}`;
      } else if (group) {
        // 只有分组没有名字？通常不允许，或者当作名字
        finalRemark = `${group}_`; 
      }
      
      try {
        const res = await fetch(`${API_BASE}/folders/${encodeURIComponent(ip)}/remark`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ remark: finalRemark })
        });
        if (!res.ok) throw new Error('保存失败');
        remarkModal.hide();
        refreshFolders();
      } catch (e) {
        showError(e.message || '保存失败');
      }
    });

    // 切换上传开关状态
    async function toggleUploadEnabled(ip, enabled) {
      const checkboxId = `uploadEnabled_${ip.replace(/\./g, '_')}`;
      const checkbox = document.getElementById(checkboxId);
      // 通过label的for属性找到对应的label，或者通过父元素查找
      const label = checkbox ? (document.querySelector(`label[for="${checkboxId}"]`) || checkbox.closest('.form-check')?.querySelector('label')) : null;
      
      try {
        const res = await fetch(`${API_BASE}/folders/${encodeURIComponent(ip)}/upload_enabled`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ upload_enabled: enabled })
        });
        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || '更新失败');
        }
        
        // 更新本地数据
        const folder = allFolders.find(f => f.ip === ip);
        if (folder) {
          folder.upload_enabled = enabled;
        }
        
        // 更新UI：文字和图标
        if (label) {
          const icon = label.querySelector('i');
          const text = label.querySelector('span');
          if (icon) {
            icon.className = enabled ? 'bi bi-cloud-upload' : 'bi bi-cloud-slash';
          }
          if (text) {
            text.textContent = enabled ? '允许上传' : '禁止上传';
          }
        }
        
        showSuccess(enabled ? '已启用视频上传' : '已禁用视频上传');
      } catch (e) {
        showError(e.message || '更新失败，请重试');
        // 恢复checkbox状态
        if (checkbox) {
          checkbox.checked = !enabled;
        }
        // 恢复UI文字和图标
        if (label) {
          const icon = label.querySelector('i');
          const text = label.querySelector('span');
          if (icon) {
            icon.className = !enabled ? 'bi bi-cloud-upload' : 'bi bi-cloud-slash';
          }
          if (text) {
            text.textContent = !enabled ? '允许上传' : '禁止上传';
          }
        }
      }
    }

    function showSuccess(msg) {
      const toastEl = document.getElementById('toast');
      toastEl.className = 'toast text-bg-success';
      document.getElementById('toastBody').textContent = msg;
      toast.show();
    }


    // 搜索功能：支持 IP 和备注名搜索
    let searchTimeout = null;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      if (searchTimeout) clearTimeout(searchTimeout);
      searchTimeout = setTimeout(applyFilters, 300);
    });

    function showError(msg) {
      const toastEl = document.getElementById('toast');
      toastEl.className = 'toast text-bg-danger';
      document.getElementById('toastBody').textContent = msg;
      toast.show();
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = isLoading;
      btn.innerHTML = isLoading ? '<span class="spinner-border spinner-border-sm me-1"></span>加载中...' : '<i class="bi bi-arrow-clockwise"></i> 刷新';
      if (isLoading) {
        document.getElementById('foldersList').innerHTML = `
          <div class="col-12 col-sm-6 col-lg-4 col-xl-3"><div class="card p-4 skeleton" style="height: 140px; border: 0; border-radius: .75rem;"></div></div>
          <div class="col-12 col-sm-6 col-lg-4 col-xl-3"><div class="card p-4 skeleton" style="height: 140px; border: 0; border-radius: .75rem;"></div></div>
          <div class="col-12 col-sm-6 col-lg-4 col-xl-3"><div class="card p-4 skeleton" style="height: 140px; border: 0; border-radius: .75rem;"></div></div>
          <div class="col-12 col-sm-6 col-lg-4 col-xl-3"><div class="card p-4 skeleton" style="height: 140px; border: 0; border-radius: .75rem;"></div></div>`;
      }
    }

    function viewFolder(ip) { window.location.href = `folder.html?ip=${encodeURIComponent(ip)}`; }

    async function logout() {
      try {
        await fetch(`${API_BASE}/logout`, { method: 'POST', credentials: 'include' });
        window.location.href = 'login.html';
      } catch { window.location.href = 'login.html'; }
    }

    function refreshFolders() { loadFolders(); }

    // 关闭预览时清空 iframe（webrtc_server 侧会在预览页卸载时自行释放）
    document.getElementById('previewModal').addEventListener('hidden.bs.modal', async () => {
      const frame = document.getElementById('previewFrame');
      frame.src = 'about:blank';
      
      if (currentPreviewIp) {
        // 关闭直连推流
        updateWebrtcDirect(currentPreviewIp, false);
        currentPreviewIp = null;
      }
    });

    // 页面加载
    checkAuth();
    loadFolders();
    
    // 自动刷新 (每30秒)，以配合心跳更新在线状态
    setInterval(() => loadFolders(true), 60000);
  </script>
</body>
</html>
